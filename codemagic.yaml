workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned app
        script: |
          set -o pipefail
          xcodebuild \
            -project MyWords.xcodeproj \
            -scheme MyWords \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER=com.mingyan.zhushou \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "no .app found, build failed"; exit 1; fi
          echo "APP = $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry mingyan-unsigned.ipa Payload
          ls -lh mingyan-unsigned.ipa
    artifacts:
      - out/*.ipa
