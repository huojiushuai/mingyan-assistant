name: Build IPA

# 推到 GitHub 后自动开始；也可以在 Actions 页面点 "Run workflow" 手动跑
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID（可选，留空用 com.mingyan.zhushou）'
        required: false
        default: ''

jobs:
  build:
    # GitHub 免费提供的 macOS 机器，自带 Xcode，不用自己有 Mac
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示环境
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -project MyWords.xcodeproj -list

      # 判断有没有配签名证书（仓库 Settings → Secrets 里的 P12_BASE64 + MOBILEPROVISION_BASE64）
      - name: 检查签名配置
        id: mode
        env:
          P12: ${{ secrets.P12_BASE64 }}
          PROFILE: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "检测到签名证书，将导出【已签名 ipa】"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "没有签名证书，将导出【未签名 ipa】"
          fi

      # ---------- 路线 A：没证书 → 编出未签名 ipa ----------
      - name: 编译（未签名）
        if: steps.mode.outputs.signed == 'false'
        run: |
          set -o pipefail
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="com.mingyan.zhushou"; fi

          xcodebuild \
            -project MyWords.xcodeproj \
            -scheme MyWords \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包成 ipa（未签名）
        if: steps.mode.outputs.signed == 'false'
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "没找到 .app，编译失败"; exit 1; fi
          echo "APP = $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry mingyan-unsigned.ipa Payload
          ls -lh mingyan-unsigned.ipa

      # ---------- 路线 B：配了证书 → 导出已签名 ipa ----------
      - name: 安装签名证书
        if: steps.mode.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          security create-keychain -p "$P12_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$P12_PASSWORD" $KEYCHAIN

          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain-db

          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i profile.mobileprovision | plutil -extract Name raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "证书安装完成：$PROFILE_NAME"

      - name: 归档并导出（已签名）
        if: steps.mode.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
          BUNDLE_ID_INPUT: ${{ github.event.inputs.bundle_id }}
        run: |
          set -o pipefail
          BUNDLE_ID="$BUNDLE_ID_INPUT"
          if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="com.mingyan.zhushou"; fi
          METHOD="$EXPORT_METHOD"
          if [ -z "$METHOD" ]; then METHOD="development"; fi

          xcodebuild \
            -project MyWords.xcodeproj \
            -scheme MyWords \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyWords.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          rm -rf out && mkdir -p out

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            "  <key>method</key><string>${METHOD}</string>" \
            "  <key>teamID</key><string>${TEAM_ID}</string>" \
            '  <key>signingStyle</key><string>manual</string>' \
            '  <key>signingCertificate</key><string>Apple Distribution</string>' \
            '  <key>stripSwiftSymbols</key><true/>' \
            '  <key>compileBitcode</key><false/>' \
            "  <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>" \
            '</dict>' \
            '</plist>' > ExportOptions.plist

          cat ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/MyWords.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath out

          ls -lh out

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: mingyan-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 14
